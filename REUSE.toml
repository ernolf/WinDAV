version = 1
SPDX-PackageName = "WinDAV"
SPDX-PackageDownloadLocation = "https://github.com/ernolf/WinDAV"

# Every file whose syntax has room for a comment carries its own SPDX header. Listed
# here are the ones whose syntax has none.

[[annotations]]
path = ["LICENSE", "global.json", "**/packages.lock.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 [ernolf] Raphael Gradenwitz"
SPDX-License-Identifier = "GPL-3.0-or-later"

# GitHub shows the funding buttons only for a file that holds nothing but what it reads.

[[annotations]]
path = [".github/FUNDING.yml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 [ernolf] Raphael Gradenwitz"
SPDX-License-Identifier = "GPL-3.0-or-later"
