name: REUSE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Check licence headers
    # Nothing here is Windows specific, and a Linux runner is the cheaper one.
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Check the copyright holder
        # reuse lint verifies that a copyright line exists, not whose name it carries,
        # so a shortened holder passes it unnoticed. The character class in the pattern
        # keeps this step from finding itself.
        run: |
          holder='[ernolf] Raphael Gradenwitz <raphael.gradenwitz@googlemail.com>'
          if git grep -n 'SPDX-FileCopyright[T]ext' | grep -Fv "$holder"; then
            echo "::error::The lines above name a copyright holder other than: $holder"
            exit 1
          fi
